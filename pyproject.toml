[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sparkle-personal-ai"
version = "0.25.0a1"
description = "Strategic Personal AI for Research, Knowledge, Learning, and Execution"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Proprietary"}
authors = [{name = "Pexxoraa"}]
dependencies = []

[project.optional-dependencies]
documents = ["pypdf>=6.0", "python-docx>=1.2"]

[project.scripts]
sparkle = "sparkle.cli:entrypoint"
sparkle-worker = "sparkle.worker_service:entrypoint"
sparkle-automations = "sparkle.automation_service:entrypoint"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sparkle = [
  "dashboard/*",
  "defaults/application/*.json",
  "defaults/ai_environment/configurations/*.json",
]

[tool.coverage.run]
branch = true
source = ["sparkle"]
