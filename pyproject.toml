[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sparkle-personal-ai"
version = "0.10.0a1"
description = "Strategic Personal AI for Research, Knowledge, Learning, and Execution"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Proprietary"}
authors = [{name = "Pexxoraa"}]
dependencies = []

[project.optional-dependencies]
documents = ["pypdf>=6.0", "python-docx>=1.2"]

[project.scripts]
sparkle = "sparkle.cli:entrypoint"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sparkle = ["dashboard/*"]

[tool.coverage.run]
branch = true
source = ["sparkle"]
