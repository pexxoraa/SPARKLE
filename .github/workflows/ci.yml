name: SPARKLE CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile and test
        run: make check

  worker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build separately deployable worker image
        run: docker build --file worker_environment/Dockerfile --tag sparkle-worker:ci .
      - name: Verify installed worker entrypoint
        run: docker run --rm sparkle-worker:ci --help
