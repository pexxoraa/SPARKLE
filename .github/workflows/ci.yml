name: SPARKLE CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile and test
        run: make check
      - name: Reproduce credential-free benchmark evidence
        run: |
          PYTHONPATH=src python -m benchmarks.run --output-dir "$RUNNER_TEMP/sparkle-benchmarks"
          diff benchmarks/evidence/results.json "$RUNNER_TEMP/sparkle-benchmarks/results.json"
          diff benchmarks/evidence/REPORT.md "$RUNNER_TEMP/sparkle-benchmarks/REPORT.md"
          cat "$RUNNER_TEMP/sparkle-benchmarks/REPORT.md" >> "$GITHUB_STEP_SUMMARY"

  worker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build separately deployable worker image
        run: docker build --file worker_environment/Dockerfile --tag sparkle-worker:ci .
      - name: Verify installed worker entrypoint
        run: docker run --rm sparkle-worker:ci --help

  controlled-execution-software:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify controlled-execution software boundary
        run: |
          PYTHONPATH=src python -m unittest \
            tests.test_ai_system_execution \
            tests.test_external_worker \
            tests.test_worker_service \
            tests.test_orchestrator_api
          PYTHONPATH=src python -m sparkle.worker_service --diagnose
          sh -n worker_environment/bootstrap-local-worker.sh
          sh -n worker_environment/install-systemd-worker.sh
          node --check src/sparkle/dashboard/app.js

  automation-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install zero-dependency automation service
        run: python -m pip install . --no-deps
      - name: Verify installed service lifecycle
        run: |
          service_state="$(mktemp -d)"
          export XDG_STATE_HOME="$service_state"
          unset SPARKLE_DATA_DIR
          sparkle-automations --check
          sparkle-automations --once
          sparkle-automations --status
