name: Refresh benchmark evidence once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    if: >-
      github.actor != 'github-actions[bot]' &&
      startsWith(github.event.head_commit.message, 'Repair CI benchmark evidence')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Regenerate locked benchmark evidence
        run: |
          PYTHONPATH=src python -m benchmarks.run --output-dir benchmarks/evidence
          git diff -- benchmarks/evidence/results.json benchmarks/evidence/REPORT.md
          if git diff --quiet -- benchmarks/evidence/results.json benchmarks/evidence/REPORT.md; then
            echo "Expected stale benchmark evidence, but regeneration produced no change" >&2
            exit 1
          fi
      - name: Commit generated evidence only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/evidence/results.json benchmarks/evidence/REPORT.md
          git diff --cached --name-only
          git commit -m "Refresh locked benchmark evidence"
          git push origin HEAD:main
