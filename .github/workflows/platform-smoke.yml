name: Focused platform smoke

on:
  workflow_dispatch:
  push:
    paths:
      - "src/sparkle/config.py"
      - "src/sparkle/platform_support.py"
      - "src/sparkle/browser_runtime.py"
      - "tests/test_platform_support.py"
      - "tests/test_browser_runtime.py"
      - ".github/workflows/platform-smoke.yml"
  pull_request:
    paths:
      - "src/sparkle/config.py"
      - "src/sparkle/platform_support.py"
      - "src/sparkle/browser_runtime.py"
      - "tests/test_platform_support.py"
      - "tests/test_browser_runtime.py"
      - ".github/workflows/platform-smoke.yml"

permissions:
  contents: read

jobs:
  platform-smoke:
    name: ${{ matrix.os }} / Python 3.12
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install --disable-pip-version-check -e .
      - name: Run focused deterministic platform tests
        run: >-
          python -m unittest
          tests.test_platform_support
          tests.test_browser_runtime
